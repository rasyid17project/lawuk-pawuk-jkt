<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lawuk Pawuk Jakarta</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #fff8f0;
  margin: 0;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 16px;
}

.menu-card {
  background: linear-gradient(145deg, #fff, #fff3ec);
  padding: 12px;
  border-radius: 14px;
  margin-bottom: 12px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.08);
}

button {
  cursor: pointer;
}

.sambal-btn, .level-btn {
  margin: 4px;
  padding: 6px 10px;
  border-radius: 20px;
  border: 1px solid #ddd;
  background: white;
}

.selected {
  background: #E8370A;
  color: white;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

.submit {
  background: #E8370A;
  color: white;
  padding: 12px;
  border-radius: 10px;
  width: 100%;
}
</style>
</head>

<body>
<div class="container">

<h2>🍱 Lawuk Pawuk Jakarta</h2>

<div id="menu"></div>

<hr>

<h3>📝 Data Pemesan</h3>
<input id="name" placeholder="Nama">
<input id="phone" placeholder="No WA">
<textarea id="address" placeholder="Alamat"></textarea>
<button onclick="getLocation()">📍 Ambil Lokasi</button>

<button class="submit" onclick="submitOrder()">Kirim Pesanan</button>

</div>

<script>
const MENU = [
  {id:1, name:'Ayam Suwir', price:18000},
  {id:2, name:'Cumi Pedas', price:18000}
];

let selected = {};

function renderMenu(){
  const el = document.getElementById('menu');

  el.innerHTML = MENU.map(m => `
    <div class="menu-card">
      <b>${m.name}</b> - Rp${m.price}
      
      <div>
        <button class="sambal-btn" onclick="selectSambal(${m.id}, this)">Sambal</button>
      </div>

      <div id="level-${m.id}"></div>
    </div>
  `).join('');
}

function selectSambal(id, btn){
  selected[id] = {sambal:true, level:1};

  btn.classList.add('selected');

  const levelDiv = document.getElementById('level-'+id);

  levelDiv.innerHTML = [1,2,3,4,5].map(l => `
    <button class="level-btn ${l===1?'selected':''}"
      onclick="setLevel(${id}, ${l}, this)">
      ${l}
    </button>
  `).join('');
}

function setLevel(id, lvl, btn){
  selected[id].level = lvl;

  btn.parentNode.querySelectorAll('.level-btn')
    .forEach(b=>b.classList.remove('selected'));

  btn.classList.add('selected');
}

function getLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    const link = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
    document.getElementById('address').value = link;
  });
}

async function submitOrder(){
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const address = document.getElementById('address').value;

  if(!name || !phone || !address){
    alert('Lengkapi data!');
    return;
  }

  for(let m of MENU){
    if(!selected[m.id]){
      alert('Semua menu wajib pilih sambal & level!');
      return;
    }
  }

  const items = Object.keys(selected).map(id=>{
    return `Menu ${id} Lv${selected[id].level}`;
  }).join(', ');

  const payload = {
    name, phone, address, items
  };

  await fetch("YOUR_SCRIPT_URL", {
    method:"POST",
    body: JSON.stringify(payload)
  });

  alert("Pesanan terkirim!");
}

renderMenu();
</script>

</body>
</html>
